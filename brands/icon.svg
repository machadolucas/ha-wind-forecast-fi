<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE3E8"/>
      <stop offset="1" stop-color="#1478A8"/>
    </linearGradient>
  </defs>
  <!-- app tile (full-bleed: edges touch the canvas so brands' trim check passes) -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- wind turbine: mast + hub + three blades, own simple flat design -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- mast -->
    <rect x="246" y="256" width="20" height="200" rx="8" fill="#ffffff" stroke="none"/>
    <!-- hub -->
    <circle cx="256" cy="246" r="16" fill="#ffffff" stroke="none"/>
    <!-- blades, 120 degrees apart -->
    <g fill="#ffffff" stroke="none">
      <path d="M256,246 C256,246 262,150 300,118 C316,146 306,196 256,246 Z"/>
      <path d="M256,246 C256,246 176,214 168,158 C200,148 246,182 256,246 Z"/>
      <path d="M256,246 C256,246 210,326 148,332 C154,300 196,258 256,246 Z"/>
    </g>
  </g>
  <!-- wind lines, motion accent -->
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round">
    <line x1="352" y1="130" x2="404" y2="130"/>
    <line x1="368" y1="170" x2="412" y2="170"/>
  </g>
</svg>
